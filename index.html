function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(ui.toastTimer);ui.toastTimer=setTimeout(()=>t.classList.remove('show'),4000);}
function commit(s){state=s;try{localStorage.setItem(E.KEY,JSON.stringify(E.core(state)));}catch(e){notify('Browser autosave unavailable. Export a JSON backup.');}render();}
// The persistent backup does not need undo snapshots; keep undo during this browser session.
function apply(result){if(result.error){notify(result.error);return;}commit(result.state);}
function characterLabel(w){return w==='mario'?'Mario':'Luigi';}
function controls(){const m=E.count(state,'mario'),l=E.count(state,'luigi'),mr=E.getChar?E.getChar(state,'mario'):state.characters.mario;
 return `<section class="intro"><div class="panel hero-panel"><div class="overline">THE CHALLENGE</div><h2>${state.mode==='242'?'The full 242-Star journey':state.mode==='61'?'The 61-Star adventure':'The 120-Star challenge'}</h2><p>Choose no missions yourself. Fate selects from Stars the game can currently offer.</p><div class="stats"><div class="stat"><strong>${m}${state.characters.mario.done.includes(D.STAR['The Star Festival'].id)?'+1':''}</strong><span>Mario / ${state.mode==='61'?61:120}</span></div><div class="stat"><strong>${l}${state.characters.luigi.done.includes(D.STAR['The Star Festival'].id)?'+1':''}</strong><span>Luigi / 120</span></div><div class="stat"><strong>${E.total(state)}</strong><span>Total / ${state.mode}</span></div></div></div>
 <div class="panel progress-panel"><div><h3>Adventure progress</h3><div class="progress-pair"><span>Mario</span><strong>${m}/${state.mode==='61'?61:120} ${state.characters.mario.done.includes(D.STAR['The Star Festival'].id)?' + Finale':''}</strong></div><div class="meter gold"><i style="width:${pct(m,state.mode==='61'?61:120)}%"></i></div><div class="progress-pair"><span>Luigi</span><strong>${l}/120 ${state.characters.luigi.done.includes(D.STAR['The Star Festival'].id)?' + Finale':''}</strong></div><div class="meter"><i style="width:${pct(l,120)}%"></i></div></div><div><div class="selector"><span class="small">Playing as</span><div class="seg"><button data-action="character" data-value="mario" class="${state.active==='mario'?'active':''}" aria-pressed="${state.active==='mario'}">Mario</button><button data-action="character" data-value="luigi" class="${state.active==='luigi'?'active':''}" aria-pressed="${state.active==='luigi'}" ${state.mode!=='242'||!E.readyForLuigi(state)?'disabled title="Complete Mario’s 120 Stars and the Bowser rematch first"':''}>Luigi</button></div></div><p class="wide-note">${state.mode==='61'?'Bowser’s Galaxy Reactor is reserved for Star 61. You can extend this goal later.':state.mode==='120'?'Can be extended to 242 Stars without losing progress.':E.readyForLuigi(state)?'Luigi’s campaign uses separate mission progress.':'Complete Mario’s 120 Stars and the Bowser rematch to unlock Luigi.'}</p></div></div></section>`;
}
function navigation(){return `<nav class="nav" aria-label="Stars of Fate sections">${[['fate','★ Fate'],['atlas','✧ Star Atlas'],['events','◈ Game events'],['save','▣ Save & rules']].map(([k,v])=>`<button type="button" data-action="tab" data-value="${k}" aria-selected="${k===ui.tab}">${v}</button>`).join('')}</nav>`;}
function sourceInfo(star){const g=D.GALAXY[star.galaxy];let arr=[];
 if(g.kind==='luma')arr.push(`Feed the ${g.dome} Hungry Luma ${g.bits.toLocaleString()} Star Bits to open this galaxy.`);
 if(star.parent)arr.push(`Use the route opened by “${star.parent}”.`);
 if(star.type==='letter')arr.push('Read the correct Mailtoad letter and rescue Luigi in this galaxy.');
 if(star.type==='green')arr.push('One of three Green Stars needed for the Planet of Trials.');
 if(star.type==='purple')arr.push('Purple Coin missions unlock only after the first Bowser victory.');
 if(star.name==="Gateway's Purple Coins")arr.push('Return to the Gate after finishing Bowser Jr.’s Lava Reactor.');
 if(star.type==='finale')arr.push('Once both brothers complete 120 Stars and their Bowser rematches, collect this mission once with each.');
 if(star.name==='Grand Star Rescue')arr.push('Opening story mission. Always first — the game offers no other mission yet.');
 return arr.length?arr.join(' '):'Select this mission in the game, complete it, then confirm the Star here.';
}
function endgame(){const who=state.active,n=E.count(state),c=state.characters[who],festival=D.STAR['The Star Festival'].id;
 if(state.mode==='61')return n>=61?`<div class="muted-card"><h3>★ 61-Star adventure complete</h3><p>Mario defeated Bowser in The Fate of the Universe and collected the final Grand Star as Star 61. You may continue to 120 or 242 Stars without losing progress.</p><div class="button-row"><button class="btn primary" data-action="extend" data-value="120">Continue to 120 Stars</button><button class="btn" data-action="extend" data-value="242">Continue to 242 Stars</button></div></div>`:'';
 if(n<120)return '';
 if(c.done.includes(festival))return `<div class="info-line"><strong>★ ${characterLabel(who)}’s 121 Stars complete.</strong> ${E.total(state)===242?'The full 242-Star challenge is complete.': 'Switch characters to finish the remaining Grand Finale Star.'}</div>`;
 if(who==='mario'&&state.mode==='120'){
  if(!c.rematch)return `<div class="muted-card"><h3>120 Stars collected — Bowser rematch next</h3><p>Defeat Bowser again in Bowser’s Galaxy Reactor to finish the 120-Star challenge and make Luigi's adventure available if you later extend the goal. No new Star is awarded.</p><div class="button-row"><button class="btn success" data-action="rematch">✓ Bowser rematch complete</button></div></div>`;
  return `<div class="muted-card"><h3>★ 120-Star adventure complete</h3><p>Mario's rematch is confirmed. You may extend to 242 Stars without losing progress.</p><div class="button-row"><button class="btn primary" data-action="extend">Continue to 242 Stars</button></div></div>`;
 }
 if(!c.rematch)return `<div class="muted-card"><h3>Bowser rematch required</h3><p>Return to Bowser’s Galaxy Reactor and defeat Bowser again with ${characterLabel(who)}. The rematch adds no new Star. Confirm after clearing it.</p><div class="button-row"><button class="btn success" data-action="rematch">I defeated Bowser again</button></div></div>`;
 if(who==='mario'&&E.readyForLuigi(state)&&!E.readyForFinale(state))return `<div class="muted-card"><h3>Luigi’s adventure is available</h3><p>Switch to Luigi, start his new adventure, and continue with Fate.</p><div class="button-row"><button class="btn primary" data-action="character" data-value="luigi">Begin Luigi’s adventure</button></div></div>`;
 if(E.readyForFinale(state)){
  const other=who==='mario'?'luigi':'mario';
  const otherHas=state.characters[other].done.includes(festival);
  if(who===state.finaleLast&&!otherHas)return `<div class="muted-card"><h3>Grand Finale — first Star still needed</h3><p>Switch to ${characterLabel(other)} and collect The Star Festival first. ${characterLabel(who)} is reserved for Star 242.</p><div class="button-row"><button class="btn primary" data-action="character" data-value="${other}">Switch to ${characterLabel(other)}</button></div></div>`;
  return `<div class="muted-card"><h3>Grand Finale Galaxy unlocked</h3><p>The Star Festival is ready for ${characterLabel(who)}. ${characterLabel(state.finaleLast)} is selected to collect Star 242.</p></div>`;
 }
 return `<div class="muted-card"><h3>All 120 Stars collected</h3><p>Finish the other character’s adventure to unlock Grand Finale Galaxy.</p></div>`;
}
function fate(){const c=state.characters[state.active],n=E.count(state),pending=state.pending,star=pending?st(pending.id):null, pool=E.eligible(state),next=D.galaxies.filter(g=>!E.isOpen(state,g)&&g.threshold>n).sort((a,b)=>a.threshold-b.threshold)[0];
 const goalChoice=`<label class="field" style="margin:10px 0 12px;max-width:420px">Super Mario Galaxy completion goal<select data-select="mode" ${state.pending?'disabled':''}><option value="61" ${state.mode==='61'?'selected':''}>61 Stars — first Bowser victory</option><option value="120" ${state.mode==='120'?'selected':''}>120 Stars — Mario and Bowser rematch</option><option value="242" ${state.mode==='242'?'selected':''}>242 Stars — Mario, Luigi and Grand Finale</option></select></label>`;
 const finaleChoice=state.mode==='242'?`<label class="field" style="margin:10px 0 12px;max-width:420px">Who collects Star 242?<select data-select="finale-last" ${state.pending||state.characters.mario.done.includes(D.STAR['The Star Festival'].id)||state.characters.luigi.done.includes(D.STAR['The Star Festival'].id)?'disabled':''}><option value="luigi" ${state.finaleLast!=='mario'?'selected':''}>Luigi collects the final Star</option><option value="mario" ${state.finaleLast==='mario'?'selected':''}>Mario collects the final Star</option></select></label>`:'';
 const mode=`<div class="selector"><span class="small">Draw style</span><div class="seg"><button class="${state.kind==='pure'?'active':''}" data-action="kind" data-value="pure">Pure Fate</button><button class="${state.kind==='galaxy'?'active':''}" data-action="kind" data-value="galaxy">Area Fate</button></div></div>`;
 let active;
 if(star){
 const checkText=pending.check==='letter'?'Has Mailtoad delivered Luigi’s letter for this rescue?':pending.check==='purple'?`Is a Purple Comet currently in orbit around ${star.galaxy} Galaxy?`:`Is the Prankster Comet currently in orbit around ${star.galaxy} Galaxy?`;
 active=`<div class="star-card"><div><span class="overline">FATE HAS CHOSEN · ${characterLabel(state.active).toUpperCase()}</span><h3>${esc(star.name)}</h3><div class="galaxy-label">${esc(star.galaxy)} Galaxy · ${esc(star.dome)}</div><div class="quest-type" style="margin-top:11px"><span class="tag ${typeClass[star.type]||''}">${esc(typeName[star.type])}</span>${star.type==='comet'||star.type==='purple'?'<span class="tag">Live orbit check</span>':''}</div><p class="star-note">${esc(sourceInfo(star))}</p></div></div>`;
 if(pending.check)active+=`<div class="info-line notice"><strong>Quick confirmation needed</strong><p>${esc(checkText)}</p><div class="button-row"><button class="btn success" data-action="confirm" data-value="yes">Yes — it’s available</button><button class="btn" data-action="confirm" data-value="no">No — draw again</button></div></div>`;
 else active+=`<div class="button-row"><button class="btn primary" data-action="collect">★ Collect Star</button><button class="btn" data-action="defer">Not available · Reroll</button></div><p class="wide-note">Only press “Collect Star” after earning it in-game. Reroll keeps this mission in the pool for a later draw.</p>`;
 }else if(n>=(state.mode==='61'?61:120)){active=endgame();if(E.readyForFinale(state)&&pool.some(x=>x.star.type==='finale')&&!c.done.includes(D.STAR['The Star Festival'].id))active+=`<div class="button-row"><button class="btn primary" data-action="draw">★ Draw the Grand Finale</button></div>`;}
 else active=`<div class="star-card"><div><span class="overline">READY WHEN YOU ARE</span><h3>Leave the next Star to Fate.</h3><p class="star-note">${n===0?'Begin with the mandatory Gateway Grand Star.':pool.length+' eligible objectives, including any events that may need a quick in-game check.'}</p></div></div><div class="button-row"><button class="btn primary block" data-action="draw">★ Draw next Star</button></div>`;
 return `<div class="cols"><div><section class="panel"><div class="section-head"><div><h2>Fate’s next objective</h2><p>${characterLabel(state.active)} · ${n}/${state.mode==='61'?61:120} Stars · ${pool.length} draw candidates</p></div>${mode}</div>${goalChoice}${finaleChoice}${active}<div class="button-row"><button class="btn small-btn" data-action="undo" ${state.history.length?'':'disabled'}>↶ Undo last action</button><button class="btn small-btn" data-action="refresh">Refresh blocked draws</button></div></section><section class="panel"><h3 style="margin-top:0">How to play</h3><ol class="howto"><li>Draw an eligible Star. Fate selects the galaxy and objective.</li><li>If asked, confirm a comet sighting or Luigi letter.</li><li>Earn that Star in-game, then select <b>Collect Star</b>.</li><li>Repeat. Progress saves automatically on this device.</li></ol><p class="wide-note"><b>Pure Fate</b> gives every eligible mission an equal chance. <b>Area Fate</b> gives each open galaxy an equal chance, then selects one of its eligible missions.</p></section></div>
 <div><section class="panel right-panel"><h3>Observatory status</h3><div class="events-short"><div class="eventrow"><div><b>Prankster Comets</b><small>Can begin once you reach 13 Stars</small></div><span class="tag ${n>=13?'green':''}">${n>=13?'Possible':'Locked'}</span></div><div class="eventrow"><div><b>Purple Comets</b><small>After first final Bowser victory</small></div><span class="tag ${E.has(state,boss)?'green':''}">${E.has(state,boss)?'Unlocked':'Locked'}</span></div><div class="eventrow"><div><b>Green Star Trials</b><small>All three Green Stars required</small></div><span class="count-pill">${D.stars.filter(x=>x.green&&c.done.includes(x.id)).length}/3</span></div><div class="eventrow"><div><b>Luigi rescue</b><small>Mailtoad letters during the run</small></div><span class="count-pill">${D.stars.filter(x=>x.type==='letter'&&c.done.includes(x.id)).length}/3</span></div></div>${next?`<div class="info-line">Next Star-count threshold: <b>${next.threshold} Stars</b> — ${esc(next.name)}. Other story conditions may also apply.</div>`:''}</section>
 <section class="panel right-panel"><h3>Recent Star collection</h3>${c.order.length?`<div class="events-short">${c.order.slice(-6).reverse().map((k,i)=>`<div class="eventrow"><div><b>★ ${esc(st(k).name)}</b><small>${esc(st(k).galaxy)} Galaxy</small></div><span class="small">#${c.order.length-i}</span></div>`).join('')}</div>`:'<p>No Stars collected yet.</p>'}</section><section class="panel right-panel"><h3>Quick tools</h3><div class="button-row"><button class="btn small-btn" data-action="tab" data-value="events">Comets & letters</button><button class="btn small-btn" data-action="tab" data-value="atlas">Star checklist</button><button class="btn small-btn" data-action="tab" data-value="save">Backup</button></div></section></div></div>`;
}
function atlas(){const c=state.characters[state.active];let rows=D.stars.filter(s=>s.galaxy.toLowerCase().includes(ui.search.toLowerCase())||s.name.toLowerCase().includes(ui.search.toLowerCase()));if(ui.dome!=='all')rows=rows.filter(s=>s.dome===ui.dome);
 rows=rows.filter(s=>{const collected=c.done.includes(s.id),ready=E.starStatus(state,s).ok;return ui.filter==='all'||ui.filter==='collected'&&collected||ui.filter==='available'&&!collected&&ready||ui.filter==='locked'&&!collected&&!ready;});
 const grouped=new Map();for(const s of rows){if(!grouped.has(s.galaxy))grouped.set(s.galaxy,[]);grouped.get(s.galaxy).push(s);}const domeSet=[...new Set(D.galaxies.map(g=>g.dome))];
 return `<section class="panel"><div class="section-head"><div><h2>Star Atlas</h2><p>All 121 missions, 42 galaxies. Change incorrect progress here without restarting.</p></div><span class="tag gold">${rows.length} shown</span></div><div class="fields"><label class="field">Search Star or galaxy<input id="atlas-search" type="search" placeholder="e.g. Purple Coins, Good Egg" value="${esc(ui.search)}"></label><label class="field">Observatory area<select data-select="dome"><option value="all">All areas</option>${domeSet.map(v=>`<option value="${esc(v)}" ${ui.dome===v?'selected':''}>${esc(v)}</option>`).join('')}</select></label><label class="field">Mission status<select data-select="filter">${[['all','All missions'],['collected','Collected'],['available','Eligible now'],['locked','Locked']].map(([v,txt])=>`<option value="${v}" ${ui.filter===v?'selected':''}>${txt}</option>`).join('')}</select></label></div><div class="info-line">Manual corrections override Fate’s normal unlock checks. Only mark a Star collected when your in-game save actually has it. A corrected Star can change which galaxies are open.</div>${[...grouped.entries()].map(([g,stars])=>`<div class="galaxy-head"><h3>${esc(g)} Galaxy</h3><small>${esc(D.GALAXY[g].dome)} · ${stars.filter(s=>c.done.includes(s.id)).length}/${D.stars.filter(s=>s.galaxy===g).length} shown</small></div>${stars.map(s=>{const collected=c.done.includes(s.id),status=E.starStatus(state,s);return `<div class="atlas-row"><div><strong>${collected?'★':'☆'} ${esc(s.name)}</strong><small>${esc(typeName[s.type])} ${s.parent?'· After '+esc(s.parent):''}</small><div class="state ${collected?'complete':status.ok?'ready':''}">${collected?'Collected':status.ok?'Eligible'+(status.check?' · requires confirmation':''):'Locked · '+esc(status.reason)}</div></div><button class="btn small-btn ${collected?'':'success'}" data-action="manual" data-value="${s.id}" data-collected="${collected?1:0}">${collected?'Undo Star':'Mark Star'}</button></div>`}).join('')}`).join('')||'<div class="empty">No missions match those filters.</div>'}</section>`;
}
function events(){const n=E.count(state),c=state.characters[state.active],letterStars=['Luigi on the Roof','Luigi under the Saucer','Luigi in the Honeyhive Kingdom'],lumas=D.galaxies.filter(g=>g.kind==='luma');
 return `<div class="cols"><div><section class="panel"><div class="section-head"><div><h2>Live game events</h2><p>Use these only when the game shows the event. Orbit sightings reset after each collected Star.</p></div></div><div class="info-line"><b>Comet visibility cannot be predicted exactly.</b> Stars of Fate checks story requirements, but you confirm what is currently visible in your save. The draw screen can ask you automatically.</div><div class="fields" style="margin-top:17px"><label class="field">Galaxy<select id="comet-galaxy">${D.galaxies.filter(g=>g.kind==='normal').map(g=>`<option value="${esc(g.id)}">${esc(g.name)}</option>`).join('')}</select></label><label class="field">Current sighting<select id="comet-type"><option value="none">None / not checked</option><option value="comet">Regular Prankster Comet</option><option value="purple">Purple Comet</option></select></label></div><div class="button-row"><button class="btn success" data-action="sighting">Save comet sighting</button><button class="btn" data-action="clear-comets">Clear old sightings</button></div><h3 style="margin:24px 0 8px;font-size:15px">Confirmed sightings</h3>${Object.entries(c.comets).length?`<div class="pill-list">${Object.entries(c.comets).map(([g,v])=>`<span class="pill">${esc(g)} · <b>${v==='comet'?'Prankster':'Purple'}</b></span>`).join('')}</div>`:'<p class="small">None confirmed. Fate will ask when it draws a comet mission.</p>'}<div class="info-line">Comets start at 13 Stars. Purple comets appear only after clearing “The Fate of the Universe” once. If a comet is in orbit, the game forces its mission instead of the galaxy’s normal mission.</div></section>
 <section class="panel"><h2 style="margin-top:0;font-size:17px">Luigi’s letters</h2><p class="small">After rescuing Luigi from Ghostly Galaxy, Mailtoad may deliver three letters in order. Mark each as received. Fate can also ask you automatically when drawing a rescue.</p>${letterStars.map((name,i)=>{const star=D.STAR[name];const checked=c.letters.includes(star.id),done=c.done.includes(star.id);return `<label class="checkbox-line"><input data-letter="${esc(name)}" type="checkbox" ${checked?'checked':''} ${done?'disabled':''}><span><strong>${i+1}. ${esc(name)}</strong><span class="small"> · ${esc(star.galaxy)} Galaxy${done?' · Star collected':''}</span></span></label>`}).join('')}</section></div><div><section class="panel right-panel"><h3>Hungry Luma galaxies</h3><p>Fate may draw these galaxies once their story requirements are met. Feed the indicated number of Star Bits when accepting the objective.</p><div class="events-short">${lumas.map(g=>`<div class="eventrow"><div><b>${esc(g.name)}</b><small>${esc(g.dome)} · After ${esc(g.prereq.join(' + '))}</small></div><span class="tag">${g.bits.toLocaleString()} bits</span></div>`).join('')}</div><p class="wide-note">The galaxy’s internal Hungry Lumas may also require Star Bits; follow the mission as normal.</p></section><section class="panel right-panel"><h3>If the game does not match Fate</h3><p>Use <b>Not available · Reroll</b> on the draw screen. The rejected mission returns after the next collected Star. You may also refresh draws manually.</p><div class="button-row"><button class="btn small-btn" data-action="refresh">Refresh deferred draws</button></div><p>To reshuffle visible comets in-game, the Comet Luma near the Terrace can charge 20 Star Bits.</p></section></div></div>`;
}
function save(){return `<section class="panel"><div class="section-head"><div><h2>Save, backup & challenge rules</h2><p>Your progress is stored locally in this browser. Keep a JSON copy before changing devices or clearing browser data.</p></div></div><div class="grid-two"><div class="event-box"><h3>Export progress</h3><p>Save both characters, your game mode, comet reports and mission history in a portable JSON file.</p><button class="btn primary" data-action="export">Download JSON backup</button></div><div class="event-box"><h3>Import progress</h3><p>Restore a Stars of Fate JSON backup. This replaces the current browser save.</p><label class="field">Select your backup<input type="file" id="import-file" accept=".json,application/json"></label></div></div><div class="panel" style="margin-top:16px;box-shadow:none"><h3 style="margin-top:0">Challenge settings</h3><div class="fields"><label class="field">Challenge length<select data-select="mode"><option value="61" ${state.mode==='61'?'selected':''}>61-Star · first Bowser ending</option><option value="120" ${state.mode==='120'?'selected':''}>120-Star · Mario only</option><option value="242" ${state.mode==='242'?'selected':''}>242-Star · Mario, Luigi and Grand Finale</option></select></label><label class="field">Draw style<select data-select="kind"><option value="pure" ${state.kind==='pure'?'selected':''}>Pure Fate · equal mission odds</option><option value="galaxy" ${state.kind==='galaxy'?'selected':''}>Area Fate · equal area odds</option></select></label></div><div class="info-line"><strong>61-Star route</strong><br>Collect 60 Power Stars and clear the four mandatory Observatory boss missions. Fate reserves Bowser’s Galaxy Reactor — The Fate of the Universe — for Star 61. Completing it ends the short challenge; the Grand Star counts as Star 61.</div><div class="info-line"><strong>Grand Finale preference</strong><br>${state.mode==='242'?`<b>${characterLabel(state.finaleLast)} collects Star 242.</b> Change this on the Fate tab before collecting either Grand Finale Star.`:'Enable 242-Star mode to select who collects Star 242.'}</div><div class="info-line"><strong>Fixed rules</strong><br>Start with Grand Star Rescue. Complete primary galaxy missions in order. Main story bosses open later domes. Three Green Stars open the trial galaxies. Prankster Comets start at 13, Purple Comets after Bowser. Luigi rescues require the corresponding letter. Finish 120 Stars and Bowser’s rematch with each character to unlock Grand Finale Galaxy.</div></div><div class="panel" style="margin-top:16px;box-shadow:none"><h3 style="margin-top:0">Start again</h3><p class="save-note">Resetting wipes the current in-browser save. Export a backup first.</p><div class="fields"><label class="field">Optional new random seed<input id="seed" type="text" inputmode="numeric" placeholder="Leave blank for a new seed"></label></div><div class="button-row"><button class="btn danger" data-action="reset">Reset this challenge</button><button class="btn" data-action="undo" ${state.history.length?'':'disabled'}>Undo last action</button></div></div><div class="info-line">Stars of Fate is a browser-based challenge companion, not a live game reader. It cannot see your in-game progress, current comet positions, unread letters or Star Bit balances. Confirm these details when asked.</div><p class="save-note" style="margin-top:16px">References: <a href="https://www.mariowiki.com/Super_Mario_Galaxy" target="_blank" rel="noopener noreferrer">Super Mario Wiki — missions and galaxy requirements</a> · <a href="https://kb.speeddemosarchive.com/Super_Mario_Galaxy" target="_blank" rel="noopener noreferrer">SpeedDemosArchive — Luigi rescue order</a></p></section>`;}
function render(){app.innerHTML=controls()+navigation()+(ui.tab==='fate'?fate():ui.tab==='atlas'?atlas():ui.tab==='events'?events():save());}
app.addEventListener('click',e=>{const btn=e.target.closest('[data-action]');if(!btn||btn.disabled)return;const action=btn.dataset.action,v=btn.dataset.value;
 switch(action){
  case 'tab':ui.tab=v;render();break;
  case 'draw':apply(E.draw(state));break;
  case 'confirm':apply(E.confirm(state,v==='yes'));break;
  case 'collect':apply(E.collect(state));break;
  case 'defer':apply(E.defer(state));break;
  case 'refresh':commit(E.refresh(state));notify('Deferred draws are available again.');break;
  case 'undo':apply(E.undo(state));break;
  case 'extend':{const target=v==='120'?'120':'242',result=E.changeMode(state,target);if(result.error){notify(result.error);break;}commit(result.state);notify(target+'-Star challenge enabled. All progress preserved.');break;}
  case 'kind':commit(E.changeKind(state,v));break;
  case 'character':commit(E.changeCharacter(state,v));break;

function metric(label,n,total,cls){return `<div class="progress-pair"><span>${esc(label)}</span><strong>${n}/${total}</strong></div><div class="meter ${cls}"><i style="width:${pct(n,total)}%"></i></div>`;}
function card(){
 const g=state.games[chosen],p=g.pending,word=chosen==='sunshine'?'Shine':'Star';
 if(chosen==='sunshine'&&!p&&E.count(state,'sunshine')===120)return `<div class="star-card"><div><span class="overline">CHALLENGE COMPLETE</span><h3>120 Shines collected!</h3><p class="star-note">${E.has(state,'sunshine','corona-1')?'Bowser’s Corona Mountain Shine is collected.':'A legacy save already had 120 Shines.'} Your adventure is complete.</p></div></div>`;
 if(chosen==='galaxy2'&&!p&&E.galaxy2Complete(state))return `<div class="star-card"><div><span class="overline">CHALLENGE COMPLETE</span><h3>${E.goalFor(state,'galaxy2')}-Star adventure completed!</h3><p class="star-note">${E.goalFor(state,'galaxy2')===71?'Bowser’s Galaxy Generator awarded Star 71.':E.goalFor(state,'galaxy2')===120?'All 120 regular Stars collected and Bowser’s rematch confirmed.':'The Perfect Run completed as Star 242.'} You may select a longer completion goal to keep playing.</p></div></div>`;
 if(chosen==='sm64'&&!p&&E.sm64FinaleDone(state))return `<div class="star-card"><div><span class="overline">CHALLENGE COMPLETE</span><h3>Bowser defeated — ${E.goalFor(state,'sm64')}-Star adventure finished!</h3><p class="star-note">Your final Bowser battle is confirmed. ${E.goalFor(state,'sm64')===70?'You can change to the 120-Star mode to continue collecting Stars.':(E.finalProtected(state,'sm64')?'All 120 Stars are collected, with Bowser in the Sky Red Coins as the finale Star.':'All 120 Stars are collected; Red Coins could have been earned earlier.')}</p></div></div>`;
 if(chosen==='sm64'&&!p&&E.count(state,'sm64')>=E.goalFor(state,'sm64')&&!E.evt(state,'sm64','key2'))return `<div class="star-card"><div><span class="overline">STAR GOAL REACHED</span><h3>Confirm the second Bowser key</h3><p class="star-note">Record your Bowser in the Fire Sea victory under Game events. The final staircase is then available.</p></div></div>`;
 if(!p)return `<div class="star-card"><div><span class="overline">READY WHEN YOU ARE</span><h3>${chosen==='sunshine'&&E.finalProtected(state,'sunshine')&&E.count(state,'sunshine')===119?'Bowser awaits in Corona Mountain!':chosen==='sm64'&&E.count(state,'sm64')===E.goalFor(state,'sm64')?'Bowser in the Sky awaits!':`Leave the next ${word} to Fate.`}</h3><p class="star-note">${chosen==='sm64'&&E.count(state,'sm64')===E.goalFor(state,'sm64')?'Your Star goal is reached. Fate will now assign the final Bowser fight. No additional Star is required.':`${E.drawOptions(state,chosen).length} eligible objectives. Every draw follows the current unlock rules.`}</p></div></div><div class="button-row"><button class="btn primary block" data-action="draw">${chosen==='sm64'&&E.count(state,'sm64')>=E.goalFor(state,'sm64')?'★ Face Bowser in the Sky':`★ Draw next ${word}`}</button></div>`;
 if(p.kind==='rematch')return `<div class="star-card"><div><span class="overline">FATE HAS CHOSEN · FINAL BOWSER REMATCH</span><h3>Bowser’s Galaxy Generator — Rematch</h3><div class="galaxy-label">${E.goalFor(state,'galaxy2')===120?'120-Star challenge finale':'Unlock the Green Star phase'}</div><p class="star-note">Return to Bowser’s Galaxy Generator and defeat Bowser again. This rematch awards no additional Star; confirm it after winning.</p></div></div><div class="button-row"><button class="btn primary" data-action="collect">✓ Bowser rematch complete</button></div>`;
 if(p.kind==='finale')return `<div class="star-card"><div><span class="overline">FATE HAS CHOSEN · FINAL SHOWDOWN</span><h3>Bowser in the Sky — Defeat Bowser</h3><div class="galaxy-label">${p.goal}-Star Challenge Finale</div><p class="star-note">You have ${p.goal} Power Stars. Enter Bowser in the Sky and defeat Bowser to finish the challenge. ${p.goal===70?'Do not collect the 8-Red-Coin Star; it is excluded from this run.':(E.finalProtected(state,'sm64')?'Your 120th Star was the 8 Red Coins here. The final battle awards no additional counted Power Star.':'You have reached 120 Stars. The final battle awards no additional counted Power Star.')}</p></div></div><div class="button-row"><button class="btn primary" data-action="collect">✓ Confirm Bowser defeated</button></div>`;
 if(p.kind==='hunt'){
  const gained=Math.max(0,E.hasBlue(state,p.zone)-(p.startCount||0)),target=p.target||1,remaining=Math.max(0,target-gained);
  return `<div class="star-card"><div><span class="overline">FATE HAS CHOSEN · BLUE COIN HUNT</span><h3>${esc(loc(chosen,p.zone))}</h3><div class="galaxy-label">Collect ${target} Blue Coin${target===1?'':'s'} · ${gained}/${target} found</div><p class="star-note">Recommended route: <b>${esc(p.route||'Current accessible area')}</b></p><p class="star-note">${esc(p.tip||'Search this area for uncollected Blue Coins.')}</p></div></div><div class="info-line"><strong>Available episode recommendation</strong><p>${esc(p.route||'Accessible area')}</p><p>${esc(p.tip||'')}</p>${p.alternatives?.length?`<p><b>Other accessible routes:</b> ${esc(p.alternatives.join(' · '))}</p>`:''}<p><b>Important:</b> Fate tracks area totals, not each coin's location. If your remaining coins are in another episode, finish this hunt early and revisit later. No penalty.</p></div><div class="button-row"><button class="btn" data-action="coin" data-area="${p.zone}" data-delta="1">+1 Blue Coin</button><button class="btn" data-action="coin" data-area="${p.zone}" data-delta="5">+5 Blue Coins</button></div><p class="wide-note">Area total: ${E.hasBlue(state,p.zone)} / ${C.sunshine.blueAreas[p.zone]} · ${remaining} more for this target · Unspent: ${E.blueBalance(state)}</p><div class="button-row"><button class="btn primary" data-action="collect" ${remaining?'disabled':''}>✓ Complete hunt</button><button class="btn" data-action="defer">Finish early · keep coins</button></div>`;
 }
 if(p.kind==='story'){
  const e=E.SUNSHINE_STORY.find(x=>x.id===p.id);
  if(!e)return `<div class="notice warn">Unknown story event. Undo to recover.</div>`;
  return `<div class="star-card"><div><span class="overline">FATE HAS CHOSEN · PLAZA STORY EVENT</span><h3>${esc(e.name)}</h3><div class="galaxy-label">${e.id==='corona-visit'?'Corona Mountain · Exploration':'Delfino Plaza · Story progression'}</div><p class="star-note">${esc(e.description)}</p></div></div><div class="info-line"><strong>No Shine Sprite awarded</strong><p>${esc(e.help)}</p><p>Complete the in-game encounter before confirming it here. This unlocks new progression without adding to your Shine total.</p></div><div class="button-row"><button class="btn primary" data-action="collect">✓ Confirm event completed</button><button class="btn" data-action="defer">Not available · Reroll</button></div>`;
 }

 const st=E.byGame[chosen][p.id];
 const tradeAmount=chosen==='sunshine'&&st.type==='trade'?(Number.isInteger(p.batchAmount)?p.batchAmount:E.affordableShines(state)):0;
 const medal=chosen==='galaxy2'&&p.id.endsWith('-m1')&&!g.medals.includes(st.zone);
 let text=chosen==='sm64'?'Enter an available course scenario, obtain this Star (even if it is not the selected mission), then confirm it here.':`Select this mission in the game, complete it, then confirm the ${word} here.`;
 if(chosen==='sm64'&&st.type==='coins')text='Collect 100 coins in one visit. The 100-Coin Star does not take you out of the course, so Fate can draw your next objective while you remain inside.';
 if(chosen==='sunshine'&&st.type==='coins')text='Collect 100 yellow coins in the recommended episode during a single visit, then take the Shine Sprite. Blue Coins do not count.';
 if(chosen==='sunshine'&&st.id==='corona-1')text=E.finalProtected(state,'sunshine')?'The final Shine is yours to claim! Enter Corona Mountain, defeat Bowser and Bowser Jr., and confirm Shine 120 after the battle.':'Enter Corona Mountain and defeat Bowser and Bowser Jr. Confirm the Shine after the battle; other Shines may remain.';
 if(st.type==='trade')text=`You have ${E.blueBalance(state)} unspent Blue Coins. Visit the Tanuki at the Delfino Plaza boathouse by Ricco Harbor. Exchange ${tradeAmount*10} Blue Coins for ${tradeAmount} Shine Sprite${tradeAmount===1?'':'s'} in one visit. Confirm only after buying them in-game.`;
 if(st.type==='green')text='Find this specific Green Star in the named galaxy.';
 if(st.type==='perfect')text='The Perfect Run requires the Grandmaster Comet Medal and Banktoad deposit.';
 let check=p.check?`<div class="info-line notice"><strong>Quick confirmation needed</strong><p>${p.check==='comet'?'Is this Prankster Comet currently active?':'Have you received the corresponding challenge letter?'}</p><div class="button-row"><button class="btn success" data-action="confirm" data-yes="1">Yes — it’s available</button><button class="btn" data-action="confirm" data-yes="0">No — draw again</button></div></div>`:'';
 const sess=chosen==='sm64'?g.courseSession:null;
 let clockInfo='';
 if(chosen==='sm64'&&st.zone==='c14'){
  const rec=E.clockRecommendation(st.id);
  const entry=st.type==='coins'?`<label class="field clock-entry" for="clock-choice">Big hand when you entered the course<select id="clock-choice"><option value="12">12 — stopped</option><option value="3">3 — slow</option><option value="6">6 — random</option><option value="9">9 — fast</option></select></label>`:'';
  clockInfo=`<div class="info-line"><strong>Tick Tock Clock entry</strong><p>Recommended: big hand at <b>${rec}</b> (${esc(E.CLOCK_LABELS[rec].split(' — ')[1])}). Clock setting is fixed until you leave the course; advanced routes may allow other settings.</p><p>12 = stopped · 3 = slow · 6 = random · 9 = fast.</p>${entry}</div>`;
 }
 let sunshineInfo='';
 if(chosen==='sunshine'&&st.type==='coins'){
  const rec=E.sunshineCoinGuide(state,st);
  if(rec){
   const alternative=rec.preferred?'':`<p><b>Earlier option:</b> Episode ${rec.episode} is available now. Episode ${rec.preferredEpisode} becomes the preferred route once unlocked.</p>`;
   sunshineInfo=`<div class="info-line"><strong>Recommended 100-Coin route</strong><p><b>${esc(rec.label)}</b></p><p>${esc(rec.tip)}</p>${alternative}<p>Collect all 100 yellow coins in one visit. After collecting the Shine, return to Delfino Plaza and draw again.</p></div>`;
  }
 }
 let sessionInfo='';
 if(chosen==='sm64'&&sess){
  const same=sess.zone===st.zone;
  const clock=same&&sess.zone==='c14'&&sess.clock?E.clockRecommendation(st.id):null;
  const mismatch=clock&&sess.clock!==clock;
  const msg=!same?`Fate picked a different course. Exit ${esc(loc(chosen,sess.zone))} before starting this objective.`:mismatch?`You're still in Tick Tock Clock with the big hand set at ${esc(sess.clock)}. The normal route for this Star recommends ${esc(clock)}. Exit and re-enter to change speed, or use a valid alternative route.`:`Fate picked the same course! You can stay inside if this Star is present in your current mission scenario. Otherwise, exit and re-enter.`;
  sessionInfo=`<div class="info-line course-session"><strong>100-Coin Star: you're still in ${esc(loc(chosen,sess.zone))}</strong><p>${msg}</p><button type="button" class="btn small" data-action="leave-course">I've left the course</button></div>`;
 }
 const medalCheck=medal?'<label class="checkbox-line"><input id="medal-with-star" type="checkbox"><span>I collected the Comet Medal during this mission</span></label>':'';
 return `<div class="star-card"><div><span class="overline">FATE HAS CHOSEN</span><h3>${esc(st.type==='trade'?`Blue Coin Exchange — ${tradeAmount} Shine Sprite${tradeAmount===1?'':'s'}`:st.name)}</h3><div class="galaxy-label">${esc(loc(chosen,st.zone))}</div><div class="quest-type" style="margin-top:11px"><span class="tag ${st.type==='green'?'green':st.type==='comet'?'red':st.type==='trade'?'gold':''}">${esc(TYPE[st.type]||'Mission')}</span></div><p class="star-note">${esc(text)}</p></div></div>${clockInfo}${sunshineInfo}${sessionInfo}${check}${medalCheck}<div class="button-row"><button class="btn primary" data-action="collect" ${!p.confirmed?'disabled':''}>${chosen==='sunshine'?(st.type==='trade'?`☀ Confirm ${tradeAmount} Shine Sprite${tradeAmount===1?'':'s'}`:'☀ Collect Shine'):'★ Collect Star'}</button><button class="btn" data-action="defer">Not available · Reroll</button></div><p class="wide-note">Only press Collect after earning it in-game. Rerolled missions return to the pool later.</p>`;
}
function fate(){
 const g=state.games[chosen],n=cVal(chosen),word=chosen==='sunshine'?'Shines':'Stars',goal=E.goalFor(state,chosen);
 const mode=`<div class="selector"><span class="small">Draw style</span><div class="seg"><button class="${g.kind==='pure'?'active':''}" data-action="kind" data-value="pure">Pure Fate</button><button class="${g.kind==='galaxy'?'active':''}" data-action="kind" data-value="galaxy">Area Fate</button></div></div>`;
 const goalChoice=chosen==='sm64'?`<div class="fields" style="margin:10px 0 12px"><label class="field">Super Mario 64 completion goal<select id="sm64-goal" aria-label="Super Mario 64 completion goal"><option value="70" ${goal===70?'selected':''}>70 Stars — final Bowser battle, no Red Coin Star</option><option value="120" ${goal===120?'selected':''}>120 Stars — optional protected finale</option></select></label></div>`:chosen==='galaxy2'?`<div class="fields" style="margin:10px 0 12px"><label class="field">Super Mario Galaxy 2 completion goal<select id="galaxy2-goal" aria-label="Super Mario Galaxy 2 completion goal" ${g.pending?'disabled':''}><option value="71" ${goal===71?'selected':''}>71 Stars — first Bowser victory</option><option value="120" ${goal===120?'selected':''}>120 Stars — Bowser rematch</option><option value="242" ${goal===242?'selected':''}>242 Stars — The Perfect Run</option></select></label></div>`:'';
 const finaleChoice=(chosen==='sunshine'||(chosen==='sm64'&&goal===120))?`<label class="checkbox" style="margin:10px 0 14px"><input type="checkbox" id="finale-protection" ${E.finalProtected(state,chosen)?'checked':''} ${g.pending||g.done.includes(chosen==='sm64'?'castle-9':'corona-1')?'disabled':''}><span><strong>Save ${chosen==='sm64'?'Bowser in the Sky Red Coins':'Bowser’s Shine'} for last</strong><small>${E.finalProtected(state,chosen)?(chosen==='sm64'?'Fate reserves the Red Coin Star for Star 120.':'Fate reserves Father and Son Shine! for Shine 120.'):(chosen==='sm64'?'Red Coins join the draw when the final stage is accessible.':'Bowser’s Shine joins the draw when Corona Mountain is accessible.')}${g.pending?' Finish or reroll your current objective to change this.':''}</small></span></label>`:'';
 const sess=chosen==='sm64'?g.courseSession:null;
 const courseNote=sess?`<div class="info-line course-session"><strong>Still in ${esc(loc('sm64',sess.zone))} after the 100-Coin Star</strong><p>Pure Fate still draws from every eligible Star. If Fate chooses a compatible Star here, you can stay. Otherwise leave and enter the next course.</p><button class="btn small" data-action="leave-course">I've left the course</button></div>`:'';
 const detail=chosen==='sunshine'?`Blue Coins: ${E.numCoins(state)}/240 collected · ${E.blueBalance(state)} unspent · ${E.affordableShines(state)} Shine(s) affordable. Fate also draws guided Blue Coin hunts and Shadow Mario Plaza events. A Plaza story event grants no Shine.`:chosen==='galaxy2'?`Comet Medals: ${E.totalMedals(state)}/49. The game may need to confirm comets and letters.`:'Keys and cap switches are confirmed under Game events.';
 return `<div class="cols"><div><section class="panel"><div class="section-head"><div><h2>Fate’s next objective</h2><p>${n}/${goal} ${word} · ${E.drawOptions(state,chosen).length} draw candidates</p></div>${mode}</div>${goalChoice}${finaleChoice}${card()}${!g.pending?courseNote:''}<div class="button-row"><button class="btn small-btn" data-action="undo" ${!g.history.length?'disabled':''}>↶ Undo last action</button><button class="btn small-btn" data-action="refresh">Refresh blocked draws</button></div></section></div><aside><section class="panel right-panel"><h3>How to play</h3><ol class="howto"><li>Fate selects an eligible objective.</li><li>Complete the mission, story event or Blue Coin hunt in-game.</li><li>Confirm completion and record earned Stars or Shines.</li><li>Any new areas unlock automatically when possible.</li></ol><div class="info-line">${esc(detail)}</div></section><section class="panel right-panel" style="margin-top:15px"><h3>The rules of Fate</h3><p>Pure Fate treats every eligible mission equally. Area Fate gives each eligible area, course or galaxy an equal chance, then selects an objective there.</p><p>No live game access is needed. When the tracker cannot know an event, it asks you to confirm it.</p><p>Export a JSON backup regularly.</p></section></aside></div>`;
}
function atlas(){const game=chosen,q=search.toLowerCase(),groups=C[game].zones.filter(z=>zoneFilter==='all'||z.id===zoneFilter);
let rows=0;let html='';for(const z of groups){const stars=C[game].stars.filter(st=>st.zone===z.id&&(!q||`${st.name} ${z.name} ${TYPE[st.type]}`.toLowerCase().includes(q))).filter(st=>filter==='all'||(filter==='done'&&E.has(state,game,st.id))||(filter==='ready'&&E.availability(state,game,st).ok)||(filter==='locked'&&!E.availability(state,game,st).ok&&!E.has(state,game,st.id)));if(!stars.length)continue;
 rows+=stars.length;html+=`<div class="list-head"><h3>${esc(z.name)}</h3><small>${stars.filter(s=>E.has(state,game,s.id)).length}/${stars.length} shown complete</small></div>`;
 for(const st of stars){const done=E.has(state,game,st.id),status=E.availability(state,game,st),ready=status.ok;html+=`<div class="mission ${done?'done':ready?'ready':''}"><div><b>${esc(st.name)}</b><small>${esc(TYPE[st.type]||st.type)}${game==='sunshine'&&st.type==='coins'&&E.sunshineCoinGuide(state,st)?' · '+esc(E.sunshineCoinGuide(state,st).label):''} · <span class="st">${done?'✓ Collected':ready?'● Eligible':'◌ '+status.reason}</span></small></div><button type="button" class="btn small" data-action="manual" data-id="${st.id}" data-mark="${done?'0':'1'}" ${(game==='sm64'||game==='sunshine')&&!done&&!ready?'disabled title="Not eligible under current progression rules"':''}>${done?'Remove':'Mark'}</button></div>`;}
 }
return `<section class="panel"><div class="section-head"><div><h2>Mission Atlas</h2><p>All ${C[game].goal} catalogue objectives, their current eligibility and manual correction controls.</p></div><span class="tag">${rows} shown</span></div><div class="fields"><label class="field">Search missions<input id="mission-search" type="search" placeholder="Mission, galaxy, type…" value="${esc(search)}"></label><label class="field">Location<select data-zone><option value="all">All areas</option>${C[game].zones.map(z=>`<option value="${z.id}" ${z.id===zoneFilter?'selected':''}>${esc(z.name)}</option>`).join('')}</select></label><label class="field">Show<select data-filter><option value="all" ${filter==='all'?'selected':''}>Everything</option><option value="ready" ${filter==='ready'?'selected':''}>Eligible</option><option value="done" ${filter==='done'?'selected':''}>Collected</option><option value="locked" ${filter==='locked'?'selected':''}>Not yet unlocked</option></select></label></div>${html||'<div class="empty">No objectives match these filters.</div>'}<p class="help">Manual adjustments bypass eligibility rules. Use them only to repair a mismatch with your actual game save.</p></section>`;}
function rowEvent(id,label,detail,available=true){const checked=E.evt(state,chosen,id);return `<label class="checkbox"><input type="checkbox" data-event="${esc(id)}" ${checked?'checked':''}><span><strong>${esc(label)}</strong><small>${esc(detail)}</small></span></label>`;}
function events(){let section='';const n=cVal(chosen);
if(chosen==='sm64')section=`<section class="panel"><h2>Castle progression</h2><p class="help">Confirm these after completing the related event in-game. Fate unlocks the next castle sections automatically.</p>${rowEvent('key1','Basement key — Bowser in the Dark World','After the 8-Star door and first Bowser victory')}${rowEvent('key2','Upper-floor key — Bowser in the Fire Sea','After the 30-Star route and second Bowser victory')}${rowEvent('wing','Wing Cap switch activated','Available at 10 Stars via the Tower of the Wing Cap')}${rowEvent('metal','Metal Cap switch activated','Accessible through Hazy Maze Cave')}${rowEvent('vanish','Vanish Cap switch activated','Drain the moat and activate its switch')}</section>`;
if(chosen==='sunshine')section=`<div class="columns"><section class="panel"><h2>Story unlocks</h2><p class="help">Fate draws eligible Shadow Mario events as separate non-Shine objectives. Use these checkboxes only to correct existing progress or events already completed in-game.</p>${rowEvent('pinna','Shadow Mario leads to Pinna Park','10 Shines; follow Shadow Mario to the cannon. Fate draws this event without awarding a Shine.')}${rowEvent('yoshi','Yoshi Egg recovered','After Pinna Park Episode 4; Fate draws the Shadow Mario chase.')}${rowEvent('turbo','Turbo Nozzle recovered','25 Shines and Yoshi; Fate draws the Shadow Mario chase.')}${rowEvent('rocket','Rocket Nozzle recovered','30 Shines and Turbo; Fate draws the Shadow Mario chase.')}${rowEvent('flood','Plaza flood / Corona entrance','After Episode 7 in all seven courses; Fate draws the story event.')}${rowEvent('corona-visit','Corona Mountain entered and exited','Enter Corona Mountain, then Exit Area to unlock the Airstrip revisit before fighting Bowser. Fate can draw this non-Shine event.')}${rowEvent('bowser','Bowser and Bowser Jr. defeated','The final Shine is reserved for Shine 120. This is recorded automatically when Fate completes Father and Son Shine!.')}</section><section class="panel"><h2>Blue Coin collection</h2><p class="help">${E.numCoins(state)}/240 collected · ${E.blueBalance(state)} unspent · ${E.affordableShines(state)} purchasable Shine(s) · ${E.coinShines(state)}/24 exchanged. Use these area counters for quick entry. Fate assigns a specific target and a recommended accessible episode, but cannot know which individual coins remain.</p>${Object.entries(C.sunshine.blueAreas).map(([area,max])=>`<div class="coin-row"><span class="name">${esc(loc(chosen,area))}</span><button class="btn small" data-action="coin" data-area="${area}" data-delta="-1" aria-label="Remove one coin in ${esc(loc(chosen,area))}">−</button><strong>${E.hasBlue(state,area)}/${max}</strong><button class="btn small" data-action="coin" data-area="${area}" data-delta="1" aria-label="Add one coin in ${esc(loc(chosen,area))}">+</button></div>`).join('')}<div class="notice">24 Shine Sprites come from exchanging 10 Blue Coins each. Logging coins does not mark exchanged Shines as collected. When Fate selects an exchange, it groups every Shine currently affordable into one visit to the Tanuki. Only confirmation spends the coins and records the Shines.</div><p class="help">Reference: <a href="https://supermarioguides.com/games/super-mario-sunshine/" rel="noopener noreferrer" target="_blank">Sunshine Blue Coin guides</a>.</p></section></div>`;
if(chosen==='galaxy2'){
const luma=[300,700,1000,1200,1500,1800,2000];section=`<div class="columns"><section class="panel"><h2>Campaign events</h2>${rowEvent('rematch','120-Star Bowser rematch complete','Available after all 120 regular Stars; unlocks the 120 Green Stars')}${rowEvent('bank','Deposited 9,999 Star Bits with Banktoad','Required for The Perfect Run after Grandmaster’s Comet Medal')}<h3>Hungry Luma galaxies</h3><p class="help">Confirm the world-map Luma transformation after feeding the required Star Bits.</p>${C.galaxy2.zones.filter(z=>z.luma).map(z=>rowEvent('luma-'+z.id,z.name,`${fmt(luma[z.world-1])} Star Bits · ${z.region}`)).join('')}<p class="help">If a letter mission or Prankster Comet is selected, Fate checks that the event is actually available.</p></section><section class="panel"><h2>Comet Medals</h2><p class="help">${E.totalMedals(state)}/49 collected. Each galaxy has a medal, normally in its opening mission. Tick any medals missed during a draw.</p>${C.galaxy2.zones.map(z=>`<label class="checkbox"><input type="checkbox" data-medal="${z.id}" ${state.games.galaxy2.medals.includes(z.id)?'checked':''}><span>${esc(z.name)}</span></label>`).join('')}</section></div>`;
}
return section;}
function saved(){const old=galaxySave();return `<section class="panel"><div class="section-head"><div><h2>Backups and settings</h2><p>Save progress for every game independently. Export all four games together for safety.</p></div></div><div class="detail-grid"><section class="panel"><h3>Export everything</h3><p class="help">Downloads the current multi-game saves and the original Galaxy v1 save when available on this same website origin.</p><button class="btn primary" data-action="export">Download JSON backup</button></section><section class="panel"><h3>Restore progress</h3><p class="help">Imports v2 backups. Combined files can also include the original Galaxy v1 save.</p><label class="field">Choose JSON file<input type="file" id="restore-file" accept=".json,application/json"></label></section></div><div class="notice">${old?'✓ A legacy Super Mario Galaxy v1 save is visible in this browser. The original tracker remains unchanged.':'The original Galaxy tracker stores its saves separately under its existing v1 key. If you are moving websites or devices, export its original JSON backup first.'}</div><div class="detail-grid" style="margin-top:15px"><section class="panel"><h3>Current game</h3><p class="help">${esc(LABELS[chosen])} · ${cVal(chosen)}/${E.goalFor(state,chosen)} collected</p><div class="actions"><button class="btn" data-action="undo" ${state.games[chosen].history.length?'':'disabled'}>↶ Undo</button><button class="btn red" data-action="reset">Reset this game only</button></div></section><section class="panel"><h3>How this works</h3><p class="help">Fate checks mission prerequisites and Sunshine story events, but cannot inspect the live game, Comet positions, letters or individual Blue Coins. Confirm those when prompted. Your data is stored only in the browser unless you export it.</p></section></div><h3>Game-specific rules</h3><p class="help"><b>Mario 64:</b> 70-Star or 120-Star mode, random eligible Stars, Bowser-key progression, optional 120th Red-Coin finale, and a final Bowser fight. <b>Sunshine:</b> 56 numbered episodes, 14 secret Shines, eight 100-Coin Shines, 15 Plaza rewards, two Airstrip Shines, 24 Blue Coin exchanges, Corona Mountain scouting and optional Bowser Shine protection. <b>Galaxy:</b> the unchanged original Mario/Luigi tracker. <b>Galaxy 2:</b> 71-Star first Bowser ending, 120-Star rematch ending, or 242-Star full run with The Perfect Run last; 49 Comet Medals in a full run.</p><p class="help">Sources: <a href="https://www.mariowiki.com/Super_Mario_64" target="_blank" rel="noopener noreferrer">Mario 64</a> · <a href="https://www.mariowiki.com/Super_Mario_Sunshine" target="_blank" rel="noopener noreferrer">Sunshine</a> · <a href="https://www.mariowiki.com/Template:SMG2_missions" target="_blank" rel="noopener noreferrer">Galaxy 2 missions</a></p><div class="notice warn"><b>Beta limitations:</b> Sunshine tracks Blue Coins by area: hunt episode suggestions cannot guarantee any specific remaining coin is obtainable. Galaxy 2's Comet/letter availability requires player confirmation. Use the reroll button when the game differs from Fate.</div></section>`;}
function render(){
 gameMenu();
 const galaxy=document.getElementById('galaxy-view');
 const showOld=chosen==='galaxy1';
 galaxy.hidden=!showOld;
 app.hidden=showOld;
 if(showOld)return;
 const content=tab==='fate'?fate():tab==='atlas'?atlas():tab==='events'?events():saved();
 app.innerHTML=hero()+switcher()+content;
}
menu.addEventListener('click',ev=>{const b=ev.target.closest('[data-game]');if(!b)return;chosen=b.dataset.game;tab='fate';search='';filter='all';zoneFilter='all';if(chosen!=='galaxy1'){state=E.switchGame(state,chosen).state;persist();}try{localStorage.setItem('sof-last-selected-v2',chosen);}catch(_){}render();});
app.addEventListener('click',ev=>{
const t=ev.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return;}
const b=ev.target.closest('[data-action]');if(!b||b.disabled||chosen==='galaxy1')return;const action=b.dataset.action,game=chosen;
switch(action){
 case 'draw':apply(E.draw(state,game));break;
 case 'kind':apply(E.updateKind(state,game,b.dataset.value));break;
 case 'confirm':apply(E.confirm(state,game,b.dataset.yes==='1'));break;
 case 'collect':apply(E.collect(state,game,{medal:!!document.getElementById('medal-with-star')?.checked,clock:document.getElementById('clock-choice')?.value}));break;
 case 'leave-course':apply(E.leaveCourse(state));break;
 case 'defer':apply(E.defer(state,game));break;
 case 'refresh':apply(E.clearDeferred(state,game));break;
 case 'undo':apply(E.undo(state,game));break;
 case 'manual':{const st=E.byGame[game][b.dataset.id],mark=b.dataset.mark==='1';if(window.confirm(`${mark?'Mark':'Remove'} “${st.name}” ${mark?'complete':'from the collected list'}?`))apply(E.adjust(state,game,st.id,mark));break;}
 case 'coin':{const area=b.dataset.area,value=E.hasBlue(state,area)+Number(b.dataset.delta);apply(E.setCoins(state,area,value));break;}
 case 'reset':if(window.confirm(`Reset ${LABELS[game]}? Export a backup first. Other games will not be affected.`))apply(E.reset(state,game));break;
 case 'export':{
  let old=galaxySave();let payload={type:'stars-of-fate-all-games',version:2,multi:E.core(state),galaxy1:old};
  const data=JSON.stringify(payload,null,2),blob=new Blob([data],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='stars-of-fate-all-games-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);message('All-game backup downloaded.');break;
 }
}
});
app.addEventListener('change',async ev=>{const x=ev.target;if(chosen==='galaxy1')return;
 if(x.id==='galaxy2-goal'){const r=E.setGalaxy2Goal(state,Number(x.value));apply(r);if(r.error)render();return;}
 if(x.id==='sm64-goal'){const r=E.setSm64Goal(state,Number(x.value));apply(r);if(r.error)render();return;}
 if(x.id==='finale-protection'){const r=E.setFinalProtection(state,chosen,x.checked);apply(r);if(r.error)render();return;}
 if(x.hasAttribute('data-kind')){apply(E.updateKind(state,chosen,x.value));return;}
 if(x.hasAttribute('data-zone')){zoneFilter=x.value;render();return;}
 if(x.hasAttribute('data-filter')){filter=x.value;render();return;}
 if(x.hasAttribute('data-event')){apply(E.toggleEvent(state,chosen,x.dataset.event,x.checked));return;}
 if(x.hasAttribute('data-medal')){apply(E.setMedal(state,x.dataset.medal,x.checked));return;}
 if(x.id==='restore-file'&&x.files?.[0]){
  try{
   const f=x.files[0];if(f.size>3_000_000)throw Error('Backup exceeds 3 MB');const obj=JSON.parse(await f.text());
   const value=E.validate(obj.multi||obj);let old=null;
   if(obj.type==='stars-of-fate-all-games'&&obj.galaxy1){old=obj.galaxy1;if(old.version!==1||!old.characters?.mario?.done||!old.characters?.luigi?.done)throw Error('Invalid legacy Galaxy backup');}
   if(window.confirm('Restore the supplied Stars of Fate backup? This overwrites the current multi-game save and may overwrite the Galaxy v1 save.')){
    state=value;persist();if(old)localStorage.setItem('stars-of-fate-v1',JSON.stringify(old));chosen=state.active;tab='fate';render();message('Progress restored.');if(old)window.location.reload();
   }
  }catch(ex){message('Import failed: '+ex.message);}
 }
});
app.addEventListener('input',ev=>{if(ev.target.id!=='mission-search')return;const pos=ev.target.selectionStart;search=ev.target.value;render();const n=document.getElementById('mission-search');n?.focus();try{n?.setSelectionRange(pos,pos)}catch(_){}});
render();
})();

</script>
</body></html>
